name: required workflow state

# Does branch protection actually require the checks this repository thinks it requires?
#
# THE DEFECT THIS EXISTS FOR, measured on this repository 2026-09-05. `review-gate.yml` was built so
# that a refusal is legible -- the constitution's Article III turns on it, and the workflow's own
# header explains that its three states exist because a reviewer who declines and applies nothing
# looks exactly like a reviewer who never ran. Its job is called `gate`.
#
# `gate` was NOT among the required contexts on `main`. Those were:
#
#     gates (ubuntu-latest)
#     gates (windows-latest)
#
# So a pull request could merge with the review gate RED, and CLAUDE.md's sentence "No PR merges
# unlabelled" was false the day it was written. Nothing in the repository could have told anybody:
# the workflow file exists, its job runs, and its result is simply not consulted.
#
# TWO FAILURE SHAPES, and this job reports both, because they need different fixes.
#
#   ORPHANED   a workflow job that looks like a gate and is required by nothing. The check runs, goes
#              red, and merges happen anyway.
#   UNBACKED   a required context with no workflow that can ever report it -- a renamed job, a
#              deleted file, or a workflow disabled in the UI. Nothing dispatches, the context never
#              arrives, and NO pull request can merge. That presents as "CI is stuck" rather than as
#              "branch protection is misconfigured", which is why it goes unfound.
#
# A TEST OVER THE YAML CANNOT SEE EITHER ONE. A disabled workflow keeps its file and its job name on
# disk, so resolving a context against the tree passes in the healthy case AND the broken one. The
# live protection API is the only thing that answers this.
#
# IT REPORTS AND NEVER CHANGES PROTECTION. Editing branch protection from a scheduled job would let
# a workflow widen what gates it, which is the same class of fault as a gate that can change what it
# decides on. review-gate.yml already separates those two jobs for that reason.

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare live required contexts against the workflows on disk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: main
        run: |
          set -euo pipefail

          # THE ENDPOINT IS THE WHOLE FIX, 2026-09-09. This read `.../branches/main/protection`,
          # which needs admin scope. A workflow token cannot have it -- `administration` is not a
          # key a `permissions:` block can name -- so the call ALWAYS failed, the escape branch
          # below ran, and the job exited 0. Every scheduled run was green having audited nothing.
          #
          # The required CONTEXT SET is also on the plain branch endpoint, which answers with no
          # token at all. Measured 2026-09-09 against this repository:
          #   curl -s .../repos/wshallwshall/korus/branches/main   -> HTTP 200,
          #     .protection.required_status_checks.contexts = the two gates legs
          #   curl -s .../branches/main/protection                 -> HTTP 401   <- control
          #   curl -s .../repos/wshallwshall/korus                 -> HTTP 200   <- control
          # Both controls fired, so the 200 is a real read rather than a host answering everything.
          # Read again 2026-09-24: the repository is MEFORORG/korus now, and $REPO follows it. The
          # old slug answers the branch and repository calls with HTTP 301, so the readings above
          # hold at 2026-09-09 only.
          #
          # It also keeps working on a fork pull request, where no elevated token exists even in
          # principle. A check that needs one silently stops covering fork contributions.
          if ! branch=$(gh api "repos/$REPO/branches/$BRANCH" 2>/dev/null); then
            {
              echo "### Required workflow state"
              echo
              echo "**COULD NOT READ \`$BRANCH\`.** Nothing was audited, and this is a FAILURE"
              echo "rather than a clean result. This endpoint needs no elevated scope, so a"
              echo "refusal here is an outage or a renamed branch, not a permission gap."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          required=$(echo "$branch" | jq -r '.protection.required_status_checks.contexts // [] | .[]' | sort -u)

          # `strict` IS NOT AUDITED, AND MUST NOT BE GUESSED. It lives only behind the admin
          # endpoint. The previous version defaulted it to `false` with `// false`, which on this
          # repository would have PUBLISHED A FALSE READING: strict is true here. An absent value
          # and a false one are different facts, and only one of them is a measurement.
          #
          # JOBS COME FROM THE `jobs:` BLOCK, NOT FROM INDENTATION. The previous version matched
          # any key indented two spaces, so `push`, `contents`, `group` and `cancel-in-progress`
          # read as jobs. Measured 2026-09-09: the old pattern returned 14 names across five
          # workflow files where six jobs exist. This awk agrees exactly with a YAML parse on all
          # five, and needs no parser installed on the runner.
          job_ids() {
            awk '
              /^jobs:[[:space:]]*(#.*)?$/ { injobs=1; next }
              /^[^[:space:]#]/            { injobs=0 }
              injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*(#.*)?$/ {
                sub(/:[[:space:]]*(#.*)?$/, ""); sub(/^  /, ""); print
              }
            ' "$1"
          }

          jobs_on_disk=$(for wf in .github/workflows/*.yml; do job_ids "$wf"; done | sort -u)

          {
            echo "### Required workflow state"
            echo
            echo "Read at $(date -u +%Y-%m-%dT%H:%M:%SZ) against \`$BRANCH\`."
            echo
            echo "**WHAT THIS RUN DID NOT AUDIT.** Only the required CONTEXT SET is checked below."
            echo "\`strict\`, \`enforce_admins\` and \`required_approving_review_count\` live only"
            echo "behind \`/branches/$BRANCH/protection\`, which needs admin scope this workflow"
            echo "cannot hold. They move independently of the context set, so a green here says"
            echo "nothing about them. Widening this job needs a token a runner should not have."
            echo
            echo "#### Required contexts, live"
            if [ -z "$required" ]; then
              echo
              echo "**NONE. Nothing gates a merge to \`$BRANCH\` at all.**"
            else
              echo
              echo '```'
              echo "$required"
              echo '```'
            fi
            echo
            echo "#### UNBACKED: required, but no job on disk could report it"
            unbacked=0
            while IFS= read -r ctx; do
              [ -z "$ctx" ] && continue
              # A matrix context reads as `job (leg)`. The job id is the part before the space.
              base="${ctx%% (*}"
              if ! echo "$jobs_on_disk" | grep -qx "$base"; then
                echo "- \`$ctx\` -- no job \`$base\` in .github/workflows/. NOTHING CAN MERGE until"
                echo "  this context reports, and it never will."
                unbacked=$((unbacked + 1))
              fi
            done <<< "$required"
            [ "$unbacked" -eq 0 ] && echo "- none"
            echo
            echo "#### ORPHANED: a gate-shaped job that gates nothing"
            echo
            echo "_Scope: workflow files named \`*gate*\` or \`*review*\` only. That is a filename"
            echo "proxy for gate-shaped, and on 2026-09-09 it matched ONE file. A gate-shaped job"
            echo "in a differently named workflow is not covered, and a green here does not say"
            echo "otherwise._"
            orphan=0
            for wf in .github/workflows/*.yml; do
              case "$(basename "$wf")" in
                *gate*|*review*) : ;;
                *) continue ;;
              esac
              for job in $(job_ids "$wf"); do
                if ! echo "$required" | grep -qE "^$job( \(|$)"; then
                  echo "- \`$job\` in \`$(basename "$wf")\` is required by nothing, so a red result"
                  echo "  there does not stop a merge."
                  orphan=$((orphan + 1))
                fi
              done
            done
            [ "$orphan" -eq 0 ] && echo "- none"
            echo
            echo "This job READS. It never edits protection: a workflow that could widen what gates"
            echo "it is the same fault as a gate that can change what it decides on."
          } | tee -a "$GITHUB_STEP_SUMMARY"
