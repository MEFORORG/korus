ander draining.</text><text x="122.5" y="548.5">Reports a stall; never drains.</text></g></g></g><g data-cell-id="queue"><g><rect x="370" y="485" width="355" height="70" rx="10.5" ry="10.5" fill="#eef5fc" stroke="#0f6cbd" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(238, 245, 252), rgb(22, 28, 34)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#242424" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(36, 36, 36), rgb(206, 206, 206));"><text x="547.5" y="517.5">Merge queue</text><text x="547.5" y="536.5">Merges into trunk</text></g></g></g><g data-cell-id="qe"><g><path d="M 445 430 L 445 457.5 L 547.5 457.5 L 547.5 474.76" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 547.5 482.76 L 543.5 474.76 L 551.5 474.76 Z" fill="#0f6cbd" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(15, 108, 189), rgb(88, 168, 237)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="454" y="449" width="87" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="496.5" y="464.5">queue entry</text></g></g></g><g data-cell-id="wd"><g><path d="M 370 520 L 302.5 520 L 302.5 522.5 L 239.47 522.5" fill="none" stroke="#616161" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(97, 97, 97), rgb(154, 154, 154));"/><path d="M 245.24 518.5 L 237.24 522.5 L 245.24 526.5" fill="none" stroke="#616161" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(97, 97, 97), rgb(154, 154, 154));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="272" y="513" width="63" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="302.5" y="528.5">readings</text></g></g></g><g data-cell-id="wdb"><g><path d="M 122.5 480 L 122.5 460 L 380 460 L 380 444.47" fill="none" stroke="#616161" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(97, 97, 97), rgb(154, 154, 154));"/><path d="M 384 450.24 L 380 442.24 L 376 450.24" fill="none" stroke="#616161" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(97, 97, 97), rgb(154, 154, 154));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="209" y="451" width="87" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="251.5" y="467">raises a stall</text></g></g></g><g data-cell-id="failed"><g><rect x="10" y="630" width="280" height="65" fill="#fde7e9" stroke="#a4262c" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(253, 231, 233), rgb(48, 30, 31)); stroke: light-dark(rgb(164, 38, 44), rgb(255, 157, 162));"/></g><g><g fill="#a4262c" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(164, 38, 44), rgb(255, 157, 162));"><text x="150" y="660">Failed check</text><text x="150" y="679">on a pull request</text></g></g></g><g data-cell-id="triage"><g><rect x="420" y="630" width="320" height="70" fill="#fff4ce" stroke="#835b00" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 244, 206), rgb(37, 28, 0)); stroke: light-dark(rgb(131, 91, 0), rgb(190, 155, 77));"/></g><g><g fill="#835b00" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(131, 91, 0), rgb(190, 155, 77));"><text x="580" y="662.5">No seat attributes a red.</text><text x="580" y="681.5">The Lander triages and routes.</text></g></g></g><g data-cell-id="fe"><g><path d="M 290 662.5 L 355 662.5 L 355 665 L 409.76 665" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 417.76 665 L 409.76 669 L 409.76 661 Z" fill="#0f6cbd" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(15, 108, 189), rgb(88, 168, 237)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="313" y="655" width="85" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="355" y="670.5">failed check</text></g></g></g><g data-cell-id="back"><g><rect x="420" y="770" width="320" height="90" rx="13.5" ry="13.5" fill="#eef5fc" stroke="#0f6cbd" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(238, 245, 252), rgb(22, 28, 34)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#242424" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(36, 36, 36), rgb(206, 206, 206));"><text x="580" y="803">Manager gets only this pull</text><text x="580" y="822">request's own failure.</text><text x="580" y="841">Everything else is the Owner's.</text></g></g></g><g data-cell-id="be"><g><path d="M 580 700 L 580 759.76" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 580 767.76 L 576 759.76 L 584 759.76 Z" fill="#0f6cbd" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(15, 108, 189), rgb(88, 168, 237)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="555" y="726" width="52" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="580" y="742">triaged</text></g></g></g><g data-cell-id="note"><g><rect x="10" y="790" width="330" height="50" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#242424" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(36, 36, 36), rgb(206, 206, 206));"><text x="175" y="812.5">Roles alone grant no merge</text><text x="175" y="831.5">authority.</text></g></g></g></g></g></g></svg>