uild, push, report.</text></g></g></g></g><g data-cell-id="handoff1"><g><path d="M 160 190 L 160 234.76" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 160 242.76 L 156 234.76 L 164 234.76 Z" fill="#0f6cbd" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(15, 108, 189), rgb(88, 168, 237)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="111" y="209" width="99" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="160" y="225">spawn + brief</text></g></g></g><g data-cell-id="lane3"><g><path d="M 15 459 L 15 425 L 305 425 L 305 459" fill="#ffffff" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 15 459 L 15 560 L 305 560 L 305 459" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="none" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 15 459 L 305 459" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="none" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#242424" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(36, 36, 36), rgb(206, 206, 206));"><text x="160" y="449">Lander</text></g></g><g data-cell-id="role3"><g><rect x="25" y="465" width="270" height="85" rx="12.75" ry="12.75" fill="#eef5fc" stroke="#0f6cbd" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(238, 245, 252), rgb(22, 28, 34)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#242424" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(36, 36, 36), rgb(206, 206, 206));"><text x="160" y="505">With operator authority,</text><text x="160" y="524">choose the merge order.</text></g></g></g></g><g data-cell-id="handoff2"><g><path d="M 160 370 L 160 414.76" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 160 422.76 L 156 414.76 L 164 414.76 Z" fill="#0f6cbd" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(15, 108, 189), rgb(88, 168, 237)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="118" y="389" width="86" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="160" y="405">pull request</text></g></g></g><g data-cell-id="queue"><g><rect x="40" y="625" width="240" height="70" rx="10.5" ry="10.5" fill="#eef5fc" stroke="#0f6cbd" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(238, 245, 252), rgb(22, 28, 34)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#242424" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(36, 36, 36), rgb(206, 206, 206));"><text x="160" y="657.5">Merge queue</text><text x="160" y="676.5">Merges into trunk</text></g></g></g><g data-cell-id="qe"><g><path d="M 160 550 L 160 614.76" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 160 622.76 L 156 614.76 L 164 614.76 Z" fill="#0f6cbd" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(15, 108, 189), rgb(88, 168, 237)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="117" y="579" width="87" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="160" y="595">queue entry</text></g></g></g><g data-cell-id="watchdog"><g><rect x="20" y="745" width="280" height="90" rx="13.5" ry="13.5" fill="#f5f5f5" stroke="#616161" stroke-width="2" stroke-dasharray="6 6" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(97, 97, 97), rgb(154, 154, 154));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><text x="160" y="778">Watchdog</text><text x="160" y="797">Keeps the Lander draining.</text><text x="160" y="816">Reports a stall; never drains.</text></g></g></g><g data-cell-id="wd"><g><path d="M 160 695 L 160 740.53" fill="none" stroke="#616161" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(97, 97, 97), rgb(154, 154, 154));"/><path d="M 156 734.76 L 160 742.76 L 164 734.76" fill="none" stroke="#616161" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(97, 97, 97), rgb(154, 154, 154));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="129" y="711" width="63" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="160" y="727">readings</text></g></g></g><g data-cell-id="failed"><g><rect x="20" y="890" width="280" height="65" fill="#fde7e9" stroke="#a4262c" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(253, 231, 233), rgb(48, 30, 31)); stroke: light-dark(rgb(164, 38, 44), rgb(255, 157, 162));"/></g><g><g fill="#a4262c" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(164, 38, 44), rgb(255, 157, 162));"><text x="160" y="920">Failed check</text><text x="160" y="939">on a pull request</text></g></g></g><g data-cell-id="triage"><g><rect x="20" y="1000" width="280" height="70" fill="#fff4ce" stroke="#835b00" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 244, 206), rgb(37, 28, 0)); stroke: light-dark(rgb(131, 91, 0), rgb(190, 155, 77));"/></g><g><g fill="#835b00" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(131, 91, 0), rgb(190, 155, 77));"><text x="160" y="1032.5">No seat attributes a red.</text><text x="160" y="1051.5">The Lander triages and routes.</text></g></g></g><g data-cell-id="fe"><g><path d="M 160 955 L 160 989.76" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 160 997.76 L 156 989.76 L 164 989.76 Z" fill="#0f6cbd" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(15, 108, 189), rgb(88, 168, 237)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="118" y="969" width="85" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="160" y="985">failed check</text></g></g></g><g data-cell-id="back"><g><rect x="20" y="1120" width="280" height="85" rx="12.75" ry="12.75" fill="#eef5fc" stroke="#0f6cbd" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(238, 245, 252), rgb(22, 28, 34)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#242424" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(36, 36, 36), rgb(206, 206, 206));"><text x="160" y="1150.5">Manager gets only this pull</text><text x="160" y="1169.5">request's own failure.</text><text x="160" y="1188.5">Everything else is the Owner's.</text></g></g></g><g data-cell-id="be"><g><path d="M 160 1070 L 160 1109.76" fill="none" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/><path d="M 160 1117.76 L 156 1109.76 L 164 1109.76 Z" fill="#0f6cbd" stroke="#0f6cbd" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(15, 108, 189), rgb(88, 168, 237)); stroke: light-dark(rgb(15, 108, 189), rgb(88, 168, 237));"/></g><g><g fill="#424242" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(66, 66, 66), rgb(180, 180, 180));"><rect fill="#ffffff" stroke="none" x="135" y="1086" width="52" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="160" y="1102">triaged</text></g></g></g><g data-cell-id="note"><g><rect x="10" y="1230" width="300" height="45" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#242424" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(36, 36, 36), rgb(206, 206, 206));"><text x="160" y="1250">Roles alone grant no merge</text><text x="160" y="1269">authority.</text></g></g></g></g></g></g></svg>